name: static-checks

on:
  push:
  pull_request:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip PyYAML pytest
      - name: Compile Python sources
        run: python -m compileall -q pdfn scripts tools tests
      - name: Validate model YAMLs
        run: python tools/validate_model_configs.py
      - name: Run dependency-light tests
        run: pytest -q
